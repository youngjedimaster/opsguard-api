services:
  - type: web
    name: opsguard-staging
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/youngjedimaster/opsguard-api
    branch: staging
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: MONGODB_DB
        value: opsguard_staging
      - key: JWT_SECRET
        generateValue: true
