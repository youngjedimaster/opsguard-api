services:
  - type: web
    name: opsguard-staging
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/youngjedimaster/opsguard-api
    branch: staging
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: APP_ENV
        value: staging
      - key: MONGODB_DB
        value: opsguard_staging
      - key: MONGODB_URI
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_CALENDAR_ACCOUNT
        value: googlecalendar_lif-bowet
      - key: CALENDAR_TIMEZONE
        value: America/Toronto
      - key: CALENDAR_GARRISON_ID
        value: garrisonstaff@gmail.com
      - key: CALENDAR_BABY_G_ID
        value: s374q7mjj2hoc77f71oml6n5uc@group.calendar.google.com
      - key: CALENDAR_TITAN_SECURITY_ID
        value: 78f673188cd9e7f1c76014eee634b0b5578f9da7f0657796fcb45e05080f45c3@group.calendar.google.com
      - key: JWT_SECRET
        generateValue: true
